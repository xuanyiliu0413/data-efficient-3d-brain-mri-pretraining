name: Python tests

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check Python syntax
        run: python -m compileall -q implementation pretraining downstream preprocessing analysis scripts tests
      - name: Run tests
        run: python -m unittest discover -s tests -v
