  train_sizes:
    12p5: 6084
    '25': 12168
    '50': 24336
    '100': 48672
  validation_size: 491
  epochs: 100
  input_shape:
  - 96
  - 96
  - 96
  patch_size:
  - 16
  - 16
  - 16
  selfmedmae:
    batch_size: 16
    optimizer: AdamW
    mask_ratio: 0.75
